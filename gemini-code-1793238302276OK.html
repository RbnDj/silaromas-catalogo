<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silaromas | Catálogo de Aromas</title>
  
  <!-- Tipografías elegantes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- PapaParse para procesamiento de CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-color: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-main: #2D2723;
      --text-muted: #736B63;
      --accent: #8E735B;
      --accent-hover: #735C47;
      --accent-light: #F2ECE4;
      --gold: #C5A059;
      --gold-light: #FBF6EE;
      --border-color: #EAE4DD;
      --whatsapp: #25D366;
      --whatsapp-dark: #1EBE5D;
      --shadow-sm: 0 4px 15px rgba(0,0,0,0.03);
      --shadow-md: 0 10px 25px rgba(0,0,0,0.06);
      --radius: 14px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-color);
      padding: 40px 0 25px 0;
      text-align: center;
      position: relative;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.2rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--text-main);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 400;
    }

    .catalog-controls {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 248, 245, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 35px;
    }

    .search-box {
      max-width: 520px;
      margin: 0 auto 18px auto;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px 14px 45px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      background-color: #FFFFFF;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(142, 115, 91, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .filter-chips {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active {
      background-color: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    /* Grilla horizontal responsiva */
    .products-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 25px;
      margin-bottom: 60px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background-color: var(--accent-light);
      overflow: hidden;
    }

    .product-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .product-card:hover .product-img {
      transform: scale(1.05);
    }

    .badge-destacado {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--gold-light);
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 600;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 2;
    }

    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .product-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      font-weight: 600;
    }

    .product-presentation {
      font-size: 0.75rem;
      background: var(--accent-light);
      color: var(--accent-hover);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .product-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .product-description {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--border-color);
      padding-top: 14px;
      margin-top: auto;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--whatsapp);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 20px;
      transition: var(--transition);
    }

    .btn-whatsapp:hover {
      background-color: var(--whatsapp-dark);
      transform: scale(1.02);
    }

    .btn-whatsapp svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .status-container {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--accent-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      background-color: #FFFFFF;
    }

    @media (max-width: 600px) {
      .brand-title {
        font-size: 2.5rem;
      }
      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <h1 class="brand-title">Silaromas</h1>
      <p class="brand-subtitle">Velas de Soja &bull; Home Mists &bull; Difusores</p>
    </div>
  </header>

  <section class="catalog-controls">
    <div class="container">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar por aroma, producto o notas olfativas...">
      </div>

      <div class="filter-chips" id="categoriesContainer">
        <button class="filter-btn active" data-category="Todos">Todos</button>
      </div>
    </div>
  </section>

  <main class="container">
    <div id="statusContainer" class="status-container">
      <div class="spinner"></div>
      <p>Cargando colección aromática...</p>
    </div>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <footer>
    <p>&copy; <span id="currentYear"></span> Silaromas. Aromas que transforman tus espacios.</p>
  </footer>

  <script>
    // Enlace API directo para lectura en vivo de tu Google Sheet
    const SPREADSHEET_ID = '1uXA3K6yZx-xFjQ_-poyINN-99xM2JAJfoeYW3Bl5EDg';
    const SHEET_API_URL = `https://opensheet.elk.sh/${SPREADSHEET_ID}/1`;
    const WHATSAPP_PHONE = '5491160302951';

    let products = [];
    let activeCategory = 'Todos';
    let searchQuery = '';

    const grid = document.getElementById('productsGrid');
    const statusContainer = document.getElementById('statusContainer');
    const searchInput = document.getElementById('searchInput');
    const categoriesContainer = document.getElementById('categoriesContainer');

    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // Formateador de imágenes de Google Drive
    function formatDriveImageUrl(url) {
      if (!url) return '';
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}=s800`;
      }
      return url;
    }

    function cleanString(str) {
      return (str || '')
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function formatPrice(value) {
      if (!value) return '$0';
      const cleanVal = value.toString().replace(/[^0-9.,]/g, '').trim();
      const num = parseFloat(cleanVal.replace(',', '.'));
      if (isNaN(num)) return value;
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(num);
    }

    function buildCategories(data) {
      const categories = ['Todos', ...new Set(data.map(item => (item.Categoria || '').trim()).filter(Boolean))];
      categoriesContainer.innerHTML = '';
      
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `filter-btn ${cat === activeCategory ? 'active' : ''}`;
        btn.textContent = cat;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCategory = cat;
          renderProducts();
        });
        categoriesContainer.appendChild(btn);
      });
    }

    function renderProducts() {
      const filtered = products.filter(product => {
        const matchesCategory = (activeCategory === 'Todos') || 
          (product.Categoria && product.Categoria.trim() === activeCategory);
        
        const textToSearch = cleanString(`${product.Producto} ${product.Descripcion} ${product.Categoria}`);
        const matchesSearch = textToSearch.includes(cleanString(searchQuery));

        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        statusContainer.style.display = 'block';
        statusContainer.innerHTML = '<p>No se encontraron productos que coincidan con tu búsqueda.</p>';
        return;
      }

      statusContainer.style.display = 'none';
      grid.innerHTML = filtered.map(product => {
        const isDestacado = cleanString(product.Destacado) === 'si';
        const msg = encodeURIComponent(`¡Hola Silaromas! Quisiera consultar sobre el producto: ${product.Producto} (${formatPrice(product.Precio)})`);
        const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${msg}`;
        const imageUrl = formatDriveImageUrl(product.Imagen_URL);
        const fallbackImg = 'https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=600&q=80';

        return `
          <article class="product-card">
            ${isDestacado ? '<span class="badge-destacado">Destacado</span>' : ''}
            <div class="image-wrapper">
              <img 
                class="product-img" 
                src="${imageUrl || fallbackImg}" 
                alt="${product.Producto}" 
                loading="lazy"
                onerror="this.src='${fallbackImg}'"
              />
            </div>
            <div class="product-info">
              <div class="product-meta">
                <span class="product-category">${product.Categoria || 'Aromaterapia'}</span>
                ${product.Presentacion ? `<span class="product-presentation">${product.Presentacion}</span>` : ''}
              </div>
              <h3 class="product-title">${product.Producto}</h3>
              <p class="product-description">${product.Descripcion || ''}</p>
              <div class="product-footer">
                <span class="product-price">${formatPrice(product.Precio)}</span>
                <a href="${whatsappUrl}" target="_blank" rel="noopener noreferrer" class="btn-whatsapp">
                  <svg viewBox="0 0 24 24">
                    <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.275.073.376-.044c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.086s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12 0 2.164.573 4.195 1.572 5.952l-1.669 6.102 6.257-1.642c1.706.93 3.655 1.458 5.727 1.458 6.627 0 12-5.373 12-12s-5.373-12-12-12z"/>
                  </svg>
                  Consultar
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function fetchProducts() {
      try {
        const response = await fetch(SHEET_API_URL);
        if (!response.ok) throw new Error('No se pudo acceder a los datos');
        
        const data = await response.json();
        
        if (data && data.length > 0) {
          products = data;
          buildCategories(products);
          renderProducts();
        } else {
          throw new Error('La planilla no contiene datos.');
        }
      } catch (error) {
        console.error('Error al cargar datos:', error);
        statusContainer.style.display = 'block';
        statusContainer.innerHTML = '<p>Error al sincronizar datos. Intenta recargar la página.</p>';
      }
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderProducts();
    });

    fetchProducts();
  </script>
</body>
</html>
